services:
  - type: web
    name: lenavs-backend
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: DEMUCS_PYTHON_BIN
        value: python3
      - key: DEMUCS_CLI_BIN
        value: demucs
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: DEMUCS_DEVICE
        value: cpu
      - key: DEMUCS_THREADS
        value: "1"
      - key: DEMUCS_TIMEOUT_MS
        value: "1200000"
      - key: DEMUCS_MP3_BITRATE
        value: "320"
      - key: WHISPERX_MODEL
        value: base
      - key: WHISPERX_DEVICE
        value: cpu
      - key: WHISPERX_COMPUTE_TYPE
        value: int8
      - key: WHISPERX_LANGUAGE
        value: pt
      - key: WHISPERX_THREADS
        value: "1"
      - key: WHISPERX_TIMEOUT_MS
        value: "1500000"
