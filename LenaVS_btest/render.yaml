services:
  - type: web
    name: lenavs-backend
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: CTC_ALIGNER_MODEL
        value: MMS_FA
      - key: CTC_ALIGNER_TIMEOUT_MS
        value: 1800000
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: DEMUCS_DEVICE
        value: cpu
      - key: DEMUCS_THREADS
        value: 1
      - key: DEMUCS_TIMEOUT_MS
        value: 1200000
      - key: DEMUCS_MP3_BITRATE
        value: 320
