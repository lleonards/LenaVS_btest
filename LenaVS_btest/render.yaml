# Render Blueprint (opcional). As chaves secretas (Supabase, Stripe, SMTP)
# devem ser configuradas no painel do Render -> Environment, não aqui.
services:
  - type: web
    name: lenavs-backend
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      # ── Sincronização automática de letras (ctc-forced-aligner==1.0.2) ──
      # O venv do alinhador é criado no Dockerfile em /opt/aligner.
      - key: ALIGNER_PYTHON_BIN
        value: /opt/aligner/bin/python3
      - key: ALIGNMENT_LANGUAGE
        value: por
      - key: ALIGNMENT_THREADS
        value: "1"
      - key: ALIGNMENT_BATCH_SIZE
        value: "2"
      - key: ALIGNMENT_WINDOW_SIZE
        value: "30"
      - key: ALIGNMENT_CONTEXT_SIZE
        value: "2"
      - key: ALIGNMENT_TIMEOUT_MS
        value: "1500000"
      - key: ALIGNMENT_MIN_FREE_MEMORY_MB
        value: "1000"
      - key: ALIGNMENT_MAX_AUDIO_SECONDS
        value: "900"
